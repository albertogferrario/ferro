[package]
name = "ferro-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A Laravel-inspired web framework for Rust"
repository = "https://github.com/albertogferrario/ferro"
homepage = "https://ferro-rs.dev"
keywords = ["web", "framework", "async", "http", "server"]
categories = ["web-programming::http-server", "asynchronous"]
readme = "README.md"

[features]
default = ["inertia"]
ai = ["dep:ferro-ai"]
inertia = ["dep:ferro-inertia"]
json-ui = ["dep:ferro-json-ui"]
projections = ["dep:ferro-projections"]
stripe = ["dep:ferro-stripe"]
theme = ["dep:ferro-theme"]
whatsapp = ["dep:ferro-whatsapp"]

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
matchit = "0.8"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ferro-macros = { path = "../ferro-macros", version = "0.2" }
ferro-events = { path = "../ferro-events", version = "0.2" }
ferro-queue = { path = "../ferro-queue", version = "0.2" }
ferro-notifications = { path = "../ferro-notifications", version = "0.2" }
ferro-broadcast = { path = "../ferro-broadcast", version = "0.2" }
ferro-storage = { path = "../ferro-storage", version = "0.2" }
ferro-cache = { path = "../ferro-cache", version = "0.2" }
ferro-lang = { path = "../ferro-lang", version = "0.2" }
ferro-inertia = { path = "../ferro-inertia", version = "0.2", optional = true }
ferro-json-ui = { path = "../ferro-json-ui", version = "0.2", optional = true }
ferro-projections = { path = "../ferro-projections", version = "0.2", optional = true }
ferro-ai = { path = "../ferro-ai", version = "0.2", optional = true }
ferro-stripe = { path = "../ferro-stripe", version = "0.2", optional = true }
ferro-theme = { path = "../ferro-theme", version = "0.2", optional = true }
ferro-whatsapp = { path = "../ferro-whatsapp", version = "0.2", optional = true }
dotenvy = "0.15"
inventory = "0.3"
sea-orm = { version = "1.0", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-native-tls", "macros"] }
sea-orm-migration = "1.0"
thiserror = "1.0"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
validator = { version = "0.20", features = ["derive"] }
serde_urlencoded = "0.7"
form_urlencoded = "1"
pretty_assertions = "1.4"
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
rand = "0.8"
base64 = "0.22"
dashmap = "6"
clap = { version = "4", features = ["derive"] }
regex = "1"
hyper-tungstenite = "0.19"
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
mime_guess = "2"
sha2 = "0.10"
subtle = "2.5"
utoipa = { version = "5", default-features = false }
utoipa-redoc = { version = "6", default-features = false }
moka = { version = "0.12", features = ["sync"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
