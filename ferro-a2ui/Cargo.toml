[package]
name = "ferro-a2ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A2UI renderer for Ferro service projections (experimental; targets the A2UI v1.0 release candidate)"
repository = "https://github.com/albertogferrario/ferro"
homepage = "https://ferro-rs.dev"
readme = "README.md"
keywords = ["a2ui", "renderer", "projections", "agent-ui", "ferro"]
categories = ["web-programming"]
# Gated on A2UI v1.0 stable: not published and excluded from publish.yml until
# the Wire-Delta Watchlist passes (docs/superpowers/specs/2026-07-04-ferro-a2ui-design.md).
publish = false

[dependencies]
ferro-projections = { path = "../ferro-projections", version = "0.2" }
ferro-theme = { path = "../ferro-theme", version = "0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
