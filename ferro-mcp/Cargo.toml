[package]
name = "ferro-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP (Model Context Protocol) server for AI-assisted Ferro Framework development"
repository = "https://github.com/albertogferrario/ferro"
keywords = ["mcp", "ai", "introspection", "ferro", "development"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[dependencies]
rmcp = { version = "0.12", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
walkdir = "2"
regex = "1"
ferro-ai = { path = "../ferro-ai", version = "0.2" }
ferro-json-ui = { path = "../ferro-json-ui", version = "0.2", features = ["projections"] }
ferro-projections = { path = "../ferro-projections", version = "0.2" }
once_cell = "1"
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
dirs = "5"
dotenvy = "0.15"
toml = "0.8"
thiserror = "2"
anyhow = "1"
chrono = "0.4"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = "0.27"
strsim = "0.11"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "0.12", features = ["client", "server", "transport-async-rw"] }
serde = { version = "1", features = ["derive"] }
