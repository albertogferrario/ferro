[package]
name = "ferro-stripe"
version = "0.9.2"
edition.workspace = true
license.workspace = true
description = "Stripe payment integration for the Ferro framework"
repository = "https://github.com/albertogferrario/ferro"
keywords = ["stripe", "payments", "billing", "subscriptions", "ferro"]
categories = ["web-programming"]
readme = "README.md"

[dependencies]
async-stripe = { version = "0.41", default-features = false, features = [
    "runtime-tokio-hyper",
    "billing",
    "checkout",
    "connect",
    "webhook-events",
] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
async-trait = "0.1"
tracing = "0.1"
ferro-queue = { path = "../ferro-queue", version = "0.2" }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[features]
test-helpers = []

[[test]]
name = "dispatcher"
required-features = ["test-helpers"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
