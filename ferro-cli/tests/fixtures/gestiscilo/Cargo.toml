[package]
name = "gestiscilo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gestiscilo"
path = "src/main.rs"

[[bin]]
name = "screenshot-worker"
path = "src/bin/screenshot_worker.rs"

[workspace]
members = ["crates/core", "migration"]

[dependencies]
ferro = { path = "../../../framework" }
ferro-json-ui = { path = "../../../ferro-json-ui" }
ferro-whatsapp = { path = "../../../ferro-whatsapp" }
ferro-ai = { path = "../../../ferro-ai" }
serde = "1"
tokio = { version = "1", features = ["full"] }
