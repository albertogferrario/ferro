name: gestiscilo
region: fra1

services:
  # The container command comes from the Dockerfile ENTRYPOINT (ferro 127, D-05).
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: gestiscilo-it/app
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

# workers: (one entry per non-test/dev/debug [[bin]] other than the service)
workers:
  - name: screenshot-worker
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: /usr/local/bin/screenshot-worker
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

