# DigitalOcean App Platform spec
# Generated by ferro do:init — do not hand-edit
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: gestiscilo
region: fra1

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: gestiscilo-it/app
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /_ferro/health
      initial_delay_seconds: 10
      period_seconds: 10
    envs:
      - key: APP_ENV
        scope: RUN_TIME
        value: "production"
      # Override in DO App Platform secrets (was: http://localhost:8080)
      - key: APP_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
        type: SECRET
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        value: "sk_test_xxx"
        type: SECRET
      - key: WHATSAPP_TOKEN
        scope: RUN_TIME
        value: "xxx"
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        value: "sk-xxx"
        type: SECRET
      - key: SERVER_PORT
        scope: RUN_TIME
        value: "8080"

workers:
  - name: screenshot-worker
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: /usr/local/bin/screenshot-worker
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

databases:
  - name: db
    engine: PG
    production: true

