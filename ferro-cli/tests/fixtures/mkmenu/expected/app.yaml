# DigitalOcean App Platform spec
# Generated by ferro do:init — do not hand-edit
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: mkmenu
region: fra1

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: gestiscilo-it/mkmenu
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /_ferro/health
      initial_delay_seconds: 10
      period_seconds: 10
    envs:
      - key: APP_URL
        scope: RUN_TIME
        value: "https://mkmenu.io"
      - key: APP_KEY
        scope: RUN_TIME
        value: "base64:xxx"
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
        type: SECRET

databases:
  - name: db
    engine: PG
    production: true

