# Single source of truth for .gitignore and .dockerignore (D-18).
# Per-category flags decide which renderer includes the patterns.
# Edit this file, then run `ferro ignore:sync` (or regenerate templates) to update both.

[[category]]
name = "rust"
for_git = true
for_docker = true
git_patterns = ["/target", "Cargo.lock"]
docker_patterns = ["target/"]

[[category]]
name = "node"
for_git = true
for_docker = true
git_patterns = ["frontend/node_modules", "frontend/dist"]
docker_patterns = ["frontend/node_modules/", "frontend/dist/"]

[[category]]
name = "build"
for_git = true
for_docker = true
git_patterns = ["/public/assets"]
docker_patterns = ["public/assets/"]

[[category]]
name = "generated_types"
for_git = true
for_docker = false
patterns = ["frontend/src/types/"]

[[category]]
name = "ide"
for_git = true
for_docker = true
git_patterns = [".idea", ".vscode"]
docker_patterns = [".idea/", ".vscode/", "*.swp", "*.swo", ".DS_Store"]

[[category]]
name = "env"
for_git = true
for_docker = true
git_patterns = [".env", ".env.local", ".env.*.local"]
docker_patterns = [".env", ".env.*", "!.env.example"]

[[category]]
name = "sqlite"
for_git = false
for_docker = true
patterns = ["database.db", "*.sqlite*"]

[[category]]
name = "planning"
for_git = false
for_docker = true
patterns = [".planning/"]

[[category]]
name = "storage"
for_git = false
for_docker = true
patterns = ["storage/", "data/"]

[[category]]
name = "secrets"
for_git = false
for_docker = true
patterns = ["*.pem", "*.key"]

[[category]]
name = "logs_tmp"
for_git = false
for_docker = true
patterns = ["*.log", "tmp/"]

[[category]]
name = "git"
for_git = false
for_docker = true
patterns = [".git/", ".gitignore"]

[[category]]
name = "docker"
for_git = false
for_docker = true
patterns = ["Dockerfile", "docker-compose*.yml", ".dockerignore"]

[[category]]
name = "docs"
for_git = false
for_docker = true
patterns = ["*.md", "LICENSE"]

[[category]]
name = "tests"
for_git = false
for_docker = true
patterns = ["tests/"]
