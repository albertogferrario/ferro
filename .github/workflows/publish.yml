name: Publish

on:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish || steps.skip.outputs.should_publish }}
      version: ${{ steps.check.outputs.version || steps.skip.outputs.version }}
      new_version: ${{ steps.check.outputs.new_version || steps.skip.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Library-change gate (Phase 129, REPORT §8).
      #
      # A push only triggers a patch bump + crates.io release if at least one file
      # under a publishable crate path changed since the last v* tag. Paths under
      # app/, docs/, .github/, .planning/, scripts/, top-level *.md,
      # LICENSE, Cargo.lock, and top-level config files (.gitignore, .editorconfig,
      # rustfmt.toml, bacon.toml, deny.toml, dev.sh, llms.txt, rust-toolchain.toml)
      # are NOT publishable changes. ferro-cli/* IS a publishable change (ferro-cli
      # is published to crates.io in Wave 3). Workspace-root Cargo.toml IS a
      # publishable change (workspace version / dep updates).
      #
      # First-run edge case: no v* tag yet → treat as library change (publish).
      - name: Check for library crate changes
        id: gate
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No prior v* tag — first publish, treating as library change"
            LIB_CHANGED=1
          else
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD)
            echo "Changed paths since $LAST_TAG:"
            echo "$CHANGED"

            LIB_CHANGED=0
            while IFS= read -r path; do
              case "$path" in
                app/*) continue ;;
                docs/*|.github/*|.planning/*|scripts/*) continue ;;
                *.md|LICENSE|.gitignore|.editorconfig|rustfmt.toml) continue ;;
                bacon.toml|deny.toml|dev.sh|llms.txt|rust-toolchain.toml) continue ;;
                Cargo.lock) continue ;;
                "") continue ;;
                *) LIB_CHANGED=1; echo "Library change detected: $path"; break ;;
              esac
            done <<< "$CHANGED"
          fi
          echo "lib_changed=$LIB_CHANGED" >> $GITHUB_OUTPUT

      - name: Skip publish (no library crate changed)
        id: skip
        if: steps.gate.outputs.lib_changed == '0'
        run: |
          VERSION=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\(.*\)"/\1/')
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          echo "Skipping publish: no library crate changed since $LAST_TAG"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
          echo "should_publish=none" >> $GITHUB_OUTPUT

      - name: Check if version is tagged
        id: check
        if: steps.gate.outputs.lib_changed == '1'
        run: |
          # Get current version from Cargo.toml
          VERSION=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\(.*\)"/\1/')
          echo "Current version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this version is already tagged
          if git tag | grep -q "^v$VERSION$"; then
            echo "Version v$VERSION already tagged, will bump patch version"

            # Calculate new patch version
            IFS='.' read -r major minor patch <<< "$VERSION"
            NEW_PATCH=$((patch + 1))
            NEW_VERSION="$major.$minor.$NEW_PATCH"
            echo "New version: $NEW_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "should_publish=bump" >> $GITHUB_OUTPUT
          else
            echo "Version v$VERSION not yet tagged, will publish"
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_publish=yes" >> $GITHUB_OUTPUT
          fi

  bump-version:
    name: Bump Version
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'bump'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.check-version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in Cargo.toml
        run: |
          NEW_VERSION="${{ needs.check-version.outputs.new_version }}"
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          echo "Bumped version to $NEW_VERSION"

      - name: Commit and push
        run: |
          git add Cargo.toml
          git commit -m "chore: bump version to ${{ needs.check-version.outputs.new_version }}"
          git push

  test:
    name: Test
    needs: [check-version, bump-version]
    if: always() && (needs.check-version.outputs.should_publish == 'bump' || needs.check-version.outputs.should_publish == 'yes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin master

      - uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.88.0-${{ runner.os }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  publish:
    name: Publish to crates.io
    needs: [check-version, bump-version, test]
    if: always() && needs.test.result == 'success' && (needs.check-version.outputs.should_publish == 'bump' || needs.check-version.outputs.should_publish == 'yes')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin master

      - uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.88.0-${{ runner.os }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@v2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version to publish
        id: version
        run: |
          VERSION=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Wave 1a (pure leaf crates, no internal deps)
        run: |
          echo "Publishing Wave 1a crates..."

          # Wave 1a: Crates with ZERO internal ferro-* dependencies
          WAVE1A_CRATES="ferro-macros ferro-events ferro-queue ferro-broadcast ferro-storage ferro-cache ferro-lang ferro-theme ferro-json-ui ferro-inertia ferro-api-mcp ferro-wallet ferro-orm ferro-audit ferro-migration ferro-assets"

          for crate in $WAVE1A_CRATES; do
            echo "Publishing $crate..."
            # Capture output to check for "already exists" error
            if OUTPUT=$(cargo publish -p $crate --no-verify 2>&1); then
              echo "$crate published successfully"
            else
              if echo "$OUTPUT" | grep -q "already exists\|already uploaded"; then
                echo "$crate already published, skipping"
              else
                echo "Failed to publish $crate"
                echo "$OUTPUT"
                exit 1
              fi
            fi
            # Small delay to avoid rate limiting
            sleep 5
          done

      - name: Wait for crates.io index update (Wave 1a)
        run: |
          echo "Waiting for crates.io to index Wave 1a crates..."
          sleep 30

      - name: Publish Wave 1b (depends on Wave 1a leaves only)
        run: |
          echo "Publishing Wave 1b crates..."

          # Wave 1b: Crates that depend on Wave 1a crates
          # ferro-projections   -> ferro-theme
          # ferro-text          -> ferro-projections
          # ferro-ai            -> ferro-events, ferro-projections   (Phase 166)
          # ferro-stripe        -> ferro-events, ferro-queue
          # ferro-whatsapp      -> ferro-events, ferro-queue
          # ferro-notifications -> ferro-whatsapp, ferro-broadcast (Phase 149 / ARCH-FINDING-05)
          # ferro-payments moved to Wave 1c (depends on ferro-stripe from Wave 1b)
          WAVE1B_CRATES="ferro-projections ferro-text ferro-ai ferro-stripe ferro-whatsapp ferro-notifications ferro-reservation ferro-projection ferro-deployments"

          for crate in $WAVE1B_CRATES; do
            echo "Publishing $crate..."
            if OUTPUT=$(cargo publish -p $crate --no-verify 2>&1); then
              echo "$crate published successfully"
            else
              if echo "$OUTPUT" | grep -q "already exists\|already uploaded"; then
                echo "$crate already published, skipping"
              else
                echo "Failed to publish $crate"
                echo "$OUTPUT"
                exit 1
              fi
            fi
            sleep 5
          done

      - name: Wait for crates.io index update (Wave 1b)
        run: |
          echo "Waiting for crates.io to index Wave 1b crates..."
          sleep 30

      - name: Publish Wave 1c (depends on Wave 1b only)
        run: |
          echo "Publishing Wave 1c crates..."
          WAVE1C_CRATES="ferro-payments"
          for crate in $WAVE1C_CRATES; do
            echo "Publishing $crate..."
            if OUTPUT=$(cargo publish -p $crate --no-verify 2>&1); then
              echo "$crate published successfully"
            else
              if echo "$OUTPUT" | grep -q "already exists\|already uploaded"; then
                echo "$crate already published, skipping"
              else
                echo "Failed to publish $crate"
                echo "$OUTPUT"
                exit 1
              fi
            fi
            sleep 5
          done

      - name: Wait for crates.io index update (Wave 1c)
        run: |
          echo "Waiting for crates.io to index Wave 1c crates..."
          sleep 30

      - name: Publish Wave 2 (framework + mcp)
        run: |
          echo "Publishing Wave 2 crates..."

          # Wave 2: Framework and MCP (depend on Wave 1a + 1b)
          WAVE2_CRATES="ferro-rs ferro-mcp ferro-mcp-oauth ferro-mcp-server"

          for crate in $WAVE2_CRATES; do
            echo "Publishing $crate..."
            if OUTPUT=$(cargo publish -p $crate --no-verify 2>&1); then
              echo "$crate published successfully"
            else
              if echo "$OUTPUT" | grep -q "already exists\|already uploaded"; then
                echo "$crate already published, skipping"
              else
                echo "Failed to publish $crate"
                echo "$OUTPUT"
                exit 1
              fi
            fi
            sleep 5
          done

      - name: Wait for crates.io index update
        run: |
          echo "Waiting for crates.io to index Wave 2 crates..."
          sleep 30

      - name: Publish Wave 3 (framework-consumers)
        run: |
          echo "Publishing Wave 3 crates..."

          # Wave 3: Framework consumers (depend on Wave 2's ferro-rs)
          WAVE3_CRATES="ferro-cli ferro-bundle"

          for crate in $WAVE3_CRATES; do
            echo "Publishing $crate..."
            if OUTPUT=$(cargo publish -p $crate --no-verify 2>&1); then
              echo "$crate published successfully"
            else
              if echo "$OUTPUT" | grep -q "already exists\|already uploaded"; then
                echo "$crate already published, skipping"
              else
                echo "Failed to publish $crate"
                echo "$OUTPUT"
                exit 1
              fi
            fi
            sleep 5
          done

      - name: Tag release and trigger binary build
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          # Idempotent: only create + push the tag if it does not already exist
          # (re-runs and the bump commit's own re-trigger must not 422).
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on the remote — skipping tag creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed $TAG."
          fi
          # A tag pushed with GITHUB_TOKEN does not fire workflows (GitHub recursion
          # guard), so explicitly dispatch release.yml against the tag to build the
          # binaries + GitHub Release. workflow_dispatch is exempt from the guard.
          gh workflow run release.yml --ref "$TAG" \
            && echo "Dispatched release.yml for $TAG." \
            || echo "::warning::Could not auto-dispatch release.yml — run it manually for $TAG."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-publish-scaffold-smoke:
    name: Post-publish scaffold smoke (crates.io)
    needs: [check-version, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin master

      - name: Get published version
        id: version
        run: |
          VERSION=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for crates.io to propagate ferro-cli
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for ferro-cli $VERSION to be available on crates.io..."
          for i in $(seq 1 12); do
            if cargo search ferro-cli 2>/dev/null | grep -q "ferro-cli = \"$VERSION\""; then
              echo "ferro-cli $VERSION is available"
              break
            fi
            echo "Not yet available, retrying in 30s ($i/12)..."
            sleep 30
          done

      - name: Build Docker smoke image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker build \
            --build-arg FERRO_VERSION="$VERSION" \
            -t ferro-scaffold-smoke:$VERSION \
            ferro-cli/tests/fixtures/benchmark/

      - name: Run scaffold smoke (cargo build inside container)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker run --rm ferro-scaffold-smoke:$VERSION
