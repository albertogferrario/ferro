[package]
name = "ferro-theme"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Semantic theme tokens and intent template schema for Ferro"
repository = "https://github.com/albertogferrario/ferro"
keywords = ["theme", "tokens", "ferro", "sdui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
