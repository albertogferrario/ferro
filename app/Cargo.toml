[package]
name = "app"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
ferro = { path = "../framework", package = "ferro-rs", features = ["projections", "json-ui"] }
tokio = { version = "1", features = ["full"] }
sea-orm-migration = { version = "1.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls"] }
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
ferro-mcp-server = { path = "../ferro-mcp-server", version = "0.2" }
