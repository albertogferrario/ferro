[package]
name = "app"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
ferro = { path = "../framework", package = "ferro-rs", features = ["projections", "json-ui", "theme"] }
tokio = { version = "1", features = ["full"] }
sea-orm-migration = { version = "1.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls"] }
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
ferro-mcp-server = { path = "../ferro-mcp-server", version = "0.2" }
ferro-mcp-oauth = { path = "../ferro-mcp-oauth" }
ferro-audit = { path = "../ferro-audit", version = "0.2" }
rand = "0.8"
base64 = "0.22"
tracing = "0.1"

[dev-dependencies]
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
bytes = "1"
http-body-util = "0.1"
