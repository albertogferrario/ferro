[package]
name = "nearly"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "Nearly — a location-based, chat-less social app, built on Ferro"

[[bin]]
name = "nearly"
path = "src/main.rs"

[dependencies]
ferro = { path = "../framework", package = "ferro-rs", features = ["projections", "json-ui", "theme"] }
ferro-projections = { path = "../ferro-projections" }
tokio = { version = "1", features = ["full"] }
sea-orm-migration = { version = "1.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
ferro-json-ui = { path = "../ferro-json-ui" }
