[package]
name = "ferro-whatsapp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WhatsApp Business Cloud API integration for the Ferro framework"
repository = "https://github.com/albertogferrario/ferro"
keywords = ["whatsapp", "messaging", "notifications", "meta", "ferro"]
categories = ["web-programming"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
async-trait = "0.1"
dashmap = "6"
tokio = { version = "1", features = ["time", "rt"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ferro-events = { path = "../ferro-events", version = "0.1" }
ferro-queue = { path = "../ferro-queue", version = "0.1" }

[features]
test-helpers = []

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
