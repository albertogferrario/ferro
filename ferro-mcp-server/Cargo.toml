[package]
name = "ferro-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP tool rendering target for Ferro projections"
repository = "https://github.com/albertogferrario/ferro"
homepage = "https://ferro-rs.dev"
readme = "README.md"
keywords = ["mcp", "ferro", "projections", "server-driven"]
categories = ["web-programming", "web-programming::http-server"]

[dependencies]
ferro-projections = { path = "../ferro-projections", version = "0.2" }
ferro-mcp-oauth = { path = "../ferro-mcp-oauth", version = "0.2" }
ferro-audit = { path = "../ferro-audit", version = "0.2" }
# Optional: pulled in only when the `confirmation` feature is enabled.
# default-features = false prevents the ferro-ai `llm` default from dragging
# reqwest into ferro-mcp-server's dependency graph (D-06).
ferro-ai = { path = "../ferro-ai", version = "0.2", optional = true, default-features = false, features = ["confirmation"] }
rmcp = { version = "0.12", default-features = false, features = ["server", "macros", "base64"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls"] }

[features]
# Enables confirmation gating for destructive actions.
# Pulls in ferro-ai (confirmation module only — no reqwest, no LLM deps).
confirmation = ["dep:ferro-ai"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros", "test-util"] }
