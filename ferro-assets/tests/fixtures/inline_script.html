<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inline Script Test</title>
  <style>
body {
  color: #333;
  background:   white;
  margin:  0;
  padding: 0 16px;
}

.header {
  display:   flex;
  align-items:  center;
  gap:   8px;
}

@media (max-width: 600px) {
  .header {
    flex-direction: column;
  }
}
</style>
</head>
<body>
  <header class="header">
    <h1>   Welcome   </h1>
  </header>

  <p>   Some   content   here   </p>

  <script>
// Template literal with ${} interpolation
const greeting = `Hello, ${window.location.hostname}!
This is a multi-line
template literal.`;

// Multi-line string via concatenation
const message = "First line\n" +
  "Second line\n" +
  "Third line";

// JSON blob
const config = {
  "apiEndpoint": "/api/v1",
  "timeout": 5000,
  "features": {
    "darkMode": true,
    "notifications": false
  },
  "allowedOrigins": [
    "https://example.com",
    "https://app.example.com"
  ]
};

// Another template literal with nested expressions
const rendered = `
  <div class="${config.features.darkMode ? 'dark' : 'light'}">
    ${greeting}
  </div>
`;

console.log(rendered);
</script>
</body>
</html>
