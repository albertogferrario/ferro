[workspace]
resolver = "2"
members = [
    "framework",
    "app",
    "ferro-cli",
    "ferro-macros",
    "ferro-events",
    "ferro-queue",
    "ferro-notifications",
    "ferro-broadcast",
    "ferro-storage",
    "ferro-cache",
    "ferro-mcp",
    "ferro-mcp-server",
    "ferro-mcp-oauth",
    "ferro-inertia",
    "ferro-json-ui",
    "ferro-lang",
    "ferro-api-mcp",
    "ferro-projections",
    "ferro-stripe",
    "ferro-theme",
    "ferro-ai",
    "ferro-whatsapp",
    "ferro-wallet",
    "ferro-orm",
    "ferro-audit",
    "ferro-migration",
    "ferro-reservation",
    "ferro-projection",
    "ferro-bundle",
    "ferro-deployments",
    "ferro-assets",
]

[workspace.package]
version = "0.2.53"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"

# Disable debug-info for dev/test builds. The full `cargo test --all-features`
# build links every test binary across the workspace; with debug-info the
# dependency rlibs overflowed the CI runner disk ("ld: No space left on
# device"). Stripping debug-info cuts target size by the majority and keeps the
# --all-features test gate within the runner's disk. Panic locations
# (file!/line!) and #[should_panic(expected=...)] are unaffected.
[profile.dev]
debug = false

[profile.test]
debug = false
