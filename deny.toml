# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rmcp 0.12 — DNS rebinding in rmcp's streamable HTTP SERVER transport
    # (patched only in the 1.4.0 major). Ferro never compiles that transport:
    # ferro-mcp uses transport-io (stdio); ferro-mcp-server enables only
    # server/macros/base64 and serves /mcp through ferro's own router.
    # Re-evaluate on the rmcp 1.x upgrade (tracked in phase 253 deferred items).
    "RUSTSEC-2026-0189",

    # instant 0.1.13 — unmaintained. Pure time-utility crate, no security surface.
    # Transitive via parking_lot in the aws-smithy / tower stacks.
    "RUSTSEC-2024-0384",

    # paste 1.0.15 — unmaintained. Compile-time macro helper, runs only at build,
    # zero runtime surface. Transitive via rav1e -> ravif -> image -> ferro-wallet.
    "RUSTSEC-2024-0436",

    # rand 0.8.5 — "unsound with a custom logger using rand::rng()". The unsoundness
    # only manifests in custom logger configurations that ferro does not install.
    # Transitive via rav1e -> image -> ferro-wallet (same chain as above).
    "RUSTSEC-2026-0097",

    # rustls-webpki 0.101.7 — three TLS name-constraint / CRL-parse advisories.
    # The vulnerable version is locked in by aws-config 1.x -> aws-smithy-http-client 1.x
    # -> rustls 0.21.x. Affects only ferro-storage's optional `s3` feature; users not
    # opting into S3 are not exposed. Tracked debt: revisit when the AWS SDK pulls in
    # rustls 0.23+ (which uses rustls-webpki 0.103+, already present in our lockfile
    # via other paths).
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # lettre 0.11.19 — TLS hostname verification disabled when using the Boring TLS
    # backend. ferro-notifications ships with the default rustls/openssl backend;
    # the Boring backend is not enabled. Not applicable in our build.
    "RUSTSEC-2026-0141",

    # http-types 2.12.0 — unmaintained (INFO). Notice that Authorization::value /
    # WwwAuthenticate::value can violate documented ASCII invariants via safe code;
    # unconfirmed UB, no patched version. Transitive via async-stripe 0.41 ->
    # ferro-stripe. Tracked debt: revisit when async-stripe drops http-types.
    "RUSTSEC-2026-0174",

    # rkyv 0.7.46 — insufficient shared-pointer validation allows out-of-bounds reads
    # when validating an untrusted archive containing multiple Rc/Arc/weak pointers that
    # share a data address but carry different metadata (RUSTSEC-2026-0235). Reachable
    # only through the checked APIs (rkyv::from_bytes / rkyv::access) on untrusted input.
    # Transitive via parcel_sourcemap -> lightningcss -> ferro-assets, where rkyv only
    # serializes CSS source maps the asset pipeline generates itself; ferro never calls
    # rkyv directly and never validates a third-party archive. The 0.7 series has no
    # patched release (fixed only in >=0.8.17); remove this ignore when lightningcss
    # bumps parcel_sourcemap onto rkyv 0.8.17+.
    "RUSTSEC-2026-0235",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "NCSA",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
