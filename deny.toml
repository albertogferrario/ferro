# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # instant 0.1.13 — unmaintained. Pure time-utility crate, no security surface.
    # Transitive via parking_lot in the aws-smithy / tower stacks.
    "RUSTSEC-2024-0384",

    # paste 1.0.15 — unmaintained. Compile-time macro helper, runs only at build,
    # zero runtime surface. Transitive via rav1e -> ravif -> image -> ferro-wallet.
    "RUSTSEC-2024-0436",

    # rand 0.8.5 — "unsound with a custom logger using rand::rng()". The unsoundness
    # only manifests in custom logger configurations that ferro does not install.
    # Transitive via rav1e -> image -> ferro-wallet (same chain as above).
    "RUSTSEC-2026-0097",

    # rustls-webpki 0.101.7 — three TLS name-constraint / CRL-parse advisories.
    # The vulnerable version is locked in by aws-config 1.x -> aws-smithy-http-client 1.x
    # -> rustls 0.21.x. Affects only ferro-storage's optional `s3` feature; users not
    # opting into S3 are not exposed. Tracked debt: revisit when the AWS SDK pulls in
    # rustls 0.23+ (which uses rustls-webpki 0.103+, already present in our lockfile
    # via other paths).
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # lettre 0.11.19 — TLS hostname verification disabled when using the Boring TLS
    # backend. ferro-notifications ships with the default rustls/openssl backend;
    # the Boring backend is not enabled. Not applicable in our build.
    "RUSTSEC-2026-0141",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "NCSA",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
