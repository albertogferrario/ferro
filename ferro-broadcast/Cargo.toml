[package]
name = "ferro-broadcast"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebSocket broadcasting and real-time channels for Ferro framework"
repository = "https://github.com/albertogferrario/ferro"
keywords = ["websocket", "broadcast", "channels", "realtime", "ferro"]
categories = ["web-programming", "asynchronous"]
homepage = "https://ferro-rs.dev"
readme = "README.md"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[features]
redis-transport = ["redis"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
