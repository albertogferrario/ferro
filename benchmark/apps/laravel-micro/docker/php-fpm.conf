; php-fpm pool for the benchmark
; pm = static, max_children = 20
; This gives 20 persistent workers — enough to saturate c=256 load
; without process-spawn overhead. A standard defensible choice for
; an 8-core host under sustained concurrency.
[www]
user = www-data
group = www-data
listen = /var/run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = static
pm.max_children = 20

; Recycle workers every 1000 requests to avoid memory drift
pm.max_requests = 1000

; Logging
access.log = /proc/1/fd/1
php_admin_value[error_log] = /proc/1/fd/2
php_admin_flag[log_errors] = on
