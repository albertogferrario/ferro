[package]
name = "ferro-conduit"
version = "0.1.0"
edition = "2021"
description = "Ferro RealWorld/Conduit backend for the framework benchmark harness"

# Standalone package — NOT a member of the root ferro workspace.
# Defensively listed in the root Cargo.toml exclude array as well.

[[bin]]
name = "ferro-conduit"
path = "src/main.rs"

[dependencies]
ferro = { package = "ferro-rs", version = "0.2" }
tokio = { version = "1", features = ["full"] }
sea-orm-migration = { version = "1.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm = { version = "1.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
# Hand-rolled JWT auth — Ferro's auth is session-based only (see src/jwt.rs).
jsonwebtoken = "9"
slug = "0.1"

[dev-dependencies]
# Route-ordering test asserts against Router::match_route(&hyper::Method, path).
hyper = "1"
